# Model Configuration

# Data paths
data:
  raw_path: "data/raw/creditcard.csv"
  processed_path: "data/processed/"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

# Preprocessing
preprocessing:
  scale_features: true
  handle_missing: true
  remove_outliers: false

# Feature engineering
features:
  use_pca: false
  n_components: 20
  create_interactions: false

# Class imbalance handling
imbalance:
  method: "smote"  # Options: smote, undersample, class_weights
  sampling_strategy: 0.5
  random_state: 42

# Model configurations
models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
  
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 20
    class_weight: "balanced"
    random_state: 42
  
  xgboost:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    scale_pos_weight: 10
    random_state: 42
  
  isolation_forest:
    n_estimators: 100
    contamination: 0.002
    random_state: 42

# Training
training:
  cross_validation: true
  cv_folds: 5
  random_state: 42
  verbose: true

# Evaluation metrics
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
  threshold: 0.5

# Logging
logging:
  level: "INFO"
  log_file: "logs/training.log"
  console_output: true

# Model persistence
model:
  save_path: "models/"
  save_format: "joblib"  # Options: joblib, pickle
